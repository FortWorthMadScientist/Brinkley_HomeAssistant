title: Berta Control
button_card_templates:
  berta_control:
    show_state: true
    show_label: false
    tap_action:
      action: toggle
    hold_action:
      action: more-info
    custom_fields:
      toggle: |
        [[[
          const on = entity.state === 'on';
          return `
            <div class="berta-toggle ${on ? 'on' : 'off'}">
              <div class="berta-toggle-knob"></div>
            </div>
          `;
        ]]]
    styles:
      card:
        - height: |
            [[[
              const w = window.innerWidth;
              return (w >= 900 && w <= 1400) ? '54px' : '64px';
            ]]]
        - border-radius: 16px
        - padding: |
            [[[
              const w = window.innerWidth;
              return (w >= 900 && w <= 1400) ? '6px 8px' : '9px 12px';
            ]]]
        - background: rgba(10, 22, 30, 0.92)
        - border: 1px solid rgba(68, 129, 157, 0.28)
        - box-shadow: none
      grid:
        - grid-template-areas: '"i n s toggle"'
        - grid-template-columns: |
            [[[
              const w = window.innerWidth;
              return (w >= 900 && w <= 1400)
                ? '34px minmax(0,1fr) min-content 46px'
                : '42px 1fr min-content 52px';
            ]]]
        - align-items: center
        - column-gap: |
            [[[
              const w = window.innerWidth;
              return (w >= 900 && w <= 1400) ? '5px' : '8px';
            ]]]
      img_cell:
        - justify-self: start
        - width: 36px
        - height: 36px
      icon:
        - width: 27px
        - color: '#f7a23b'
      name:
        - justify-self: start
        - font-size: 14px
        - font-weight: 650
        - color: '#f5f7f9'
      state:
        - justify-self: end
        - font-size: 11px
        - font-weight: 800
        - text-transform: uppercase
        - color: '#8e9ba5'
      custom_fields:
        toggle:
          - justify-self: end
          - align-self: center
    state:
      - value: 'on'
        styles:
          card:
            - background: linear-gradient(90deg, rgba(9,25,35,.98), rgba(0,155,225,.24))
            - border: 1px solid rgba(37,194,255,.72)
            - box-shadow: 0 0 18px rgba(0,170,255,.22)
          icon:
            - color: '#25c2ff'
            - filter: drop-shadow(0 0 7px rgba(37,194,255,.65))
          state:
            - color: '#25c2ff'
      - value: 'off'
        styles:
          icon:
            - color: '#f6a13b'
    extra_styles: |
      .berta-toggle {
        width: 46px;
        height: 26px;
        border-radius: 999px;
        padding: 2px;
        box-sizing: border-box;
        border: 1px solid rgba(160,175,185,.45);
        background: rgba(120,130,138,.24);
        transition: all .25s ease;
      }
      .berta-toggle-knob {
        width: 20px;
        height: 20px;
        border-radius: 50%;
        background: #d7dde1;
        box-shadow: 0 1px 4px rgba(0,0,0,.35);
        transform: translateX(0);
        transition: all .25s ease;
      }
      .berta-toggle.on {
        background: linear-gradient(180deg,#34ccff,#008ac8);
        border-color: rgba(86,213,255,.9);
        box-shadow: 0 0 10px rgba(0,180,255,.34);
      }
      .berta-toggle.on .berta-toggle-knob {
        transform: translateX(20px);
        background: white;
      }
  berta_status:
    show_state: true
    show_label: true
    tap_action:
      action: more-info
    variables:
      label_text: ''
      state_text: ''
    state_display: |
      [[[
        if (variables.state_text) return variables.state_text;
        return entity.state;
      ]]]
    label: |
      [[[
        return variables.label_text || '';
      ]]]
    styles:
      card:
        - height: 82px
        - border-radius: 14px
        - padding: 8px
        - background: rgba(10, 22, 30, 0.92)
        - border: 1px solid rgba(68, 129, 157, 0.28)
        - box-shadow: none
      grid:
        - grid-template-areas: '"i n" "i s" "i l"'
        - grid-template-columns: 46px 1fr
        - grid-template-rows: min-content min-content min-content
      img_cell:
        - align-self: center
        - justify-self: center
        - width: 40px
        - height: 40px
      icon:
        - width: 30px
        - color: '#25c2ff'
      name:
        - justify-self: start
        - align-self: end
        - font-size: 12px
        - color: '#8ea8b8'
      state:
        - justify-self: start
        - align-self: center
        - font-size: 16px
        - font-weight: 700
        - color: '#f5f7f9'
      label:
        - justify-self: start
        - align-self: start
        - font-size: 11px
        - font-weight: 650
        - color: '#58d68d'
  berta_nav:
    show_state: false
    styles:
      card:
        - height: 58px
        - border-radius: 14px
        - background: rgba(7, 17, 24, 0.90)
        - border: 1px solid rgba(68, 129, 157, 0.18)
        - box-shadow: none
      grid:
        - grid-template-areas: '"i" "n"'
        - grid-template-rows: 1fr min-content
      icon:
        - width: 28px
        - color: '#aeb8bf'
      name:
        - font-size: 12px
        - color: '#dce3e7'
  berta_tank:
    show_state: true
    show_icon: false
    show_label: false
    tap_action:
      action: more-info
    variables:
      fill: '#28bffc'
    custom_fields:
      tank: |
        [[[
          const raw = parseFloat(entity.state);
          const v = Number.isFinite(raw) ? Math.max(0, Math.min(100, raw)) : 0;
          return `<div class="berta-tank-shell">
                    <div class="berta-tank-fill" style="height:${v}%;background:${variables.fill};"></div>
                  </div>`;
        ]]]
    styles:
      card:
        - height: |
            [[[
              const w = window.innerWidth;
              return (w >= 900 && w <= 1400) ? '212px' : '250px';
            ]]]
        - padding: |
            [[[
              const w = window.innerWidth;
              return (w >= 900 && w <= 1400) ? '8px 4px 8px' : '12px 8px 10px';
            ]]]
        - border-radius: 16px
        - background: rgba(10, 22, 30, 0.92)
        - border: 1px solid rgba(68, 129, 157, 0.28)
        - box-shadow: none
      grid:
        - grid-template-areas: '"n" "tank" "s"'
        - grid-template-rows: 32px 1fr 34px
        - grid-template-columns: 1fr
      name:
        - align-self: center
        - justify-self: center
        - font-size: 13px
        - font-weight: 650
        - color: '#f5f7f9'
      state:
        - align-self: center
        - justify-self: center
        - font-size: 18px
        - font-weight: 800
        - color: '#f5f7f9'
      custom_fields:
        tank:
          - align-self: stretch
          - justify-self: stretch
          - padding: 4px 10px
    state_display: |
      [[[
        const raw = parseFloat(entity.state);
        return Number.isFinite(raw) ? `${Math.round(raw)}%` : '—';
      ]]]
    extra_styles: |
      .berta-tank-shell {
        height: 100%;
        width: 100%;
        min-height: 180px;
        border-radius: 14px;
        border: 2px solid rgba(185,205,216,.55);
        background: linear-gradient(180deg, rgba(7,17,24,.92), rgba(20,35,43,.88));
        overflow: hidden;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        box-shadow: inset 0 0 18px rgba(0,0,0,.55);
      }
      .berta-tank-fill {
        width: 100%;
        min-height: 0;
        transition: height 650ms ease;
        box-shadow: 0 0 16px rgba(37,194,255,.34);
      }
      @media (min-width: 900px) and (max-width: 1400px) {
        .berta-tank-shell {
          min-height: 145px;
        }
      }
views:
  - title: Overview
    path: overview
    icon: mdi:home
    panel: true
    cards:
      - type: custom:button-card
        show_name: false
        show_icon: false
        styles:
          card:
            - min-height: calc(100vh - 56px)
            - padding: |
                [[[
                  const w = window.innerWidth;
                  return (w >= 900 && w <= 1400) ? '6px' : '12px';
                ]]]
            - border-radius: 0
            - background: >-
                radial-gradient(circle at 50% 25%, rgba(16,52,67,.32),
                rgba(3,10,15,.98) 55%)
            - box-shadow: none
            - overflow: hidden
          grid:
            - grid-template-areas: '"left center right" "footer footer footer"'
            - grid-template-columns: minmax(285px, 25%) minmax(520px, 48%) minmax(345px, 27%)
            - grid-template-rows: 1fr auto
            - column-gap: 10px
            - row-gap: 6px
            - align-items: stretch
        custom_fields:
          left:
            do_not_eval: true
            card:
              type: vertical-stack
              cards:
                - type: markdown
                  content: |
                    ## ⚡ SWITCHES & OUTPUTS
                    Lighting, power and RV systems
                  card_mod:
                    style: |
                      ha-card {
                        padding: 12px 16px 8px;
                        border-radius: 18px 18px 10px 10px;
                        border: 1px solid rgba(68,129,157,.28);
                        background: rgba(8,19,27,.94);
                        color: #f5f7f9;
                        box-shadow: none;
                      }
                      ha-markdown h2 {
                        margin: 0;
                        color: #f5f7f9;
                        letter-spacing: .04em;
                      }
                      ha-markdown p {
                        margin: 4px 0 0;
                        color: #69b8dc;
                        font-size: 13px;
                      }
                - type: custom:button-card
                  template: berta_control
                  entity: light.berta_can_2_dev_kitchen_pendants
                  name: Kitchen Pendants
                  icon: mdi:ceiling-light
                - type: custom:button-card
                  template: berta_control
                  entity: light.berta_can_2_dev_island_light
                  name: Island Light
                  icon: mdi:ceiling-light
                - type: custom:button-card
                  template: berta_control
                  entity: light.berta_can_2_dev_awning_light_1
                  name: Awning Light 1
                  icon: mdi:awning-outline
                - type: custom:button-card
                  template: berta_control
                  entity: light.berta_can_2_dev_awning_light_2
                  name: Awning Light 2
                  icon: mdi:awning-outline
                - type: custom:button-card
                  template: berta_control
                  entity: light.berta_can_2_dev_under_body_lights
                  name: Under Body Lights
                  icon: mdi:car-light-high
                - type: custom:button-card
                  template: berta_control
                  entity: light.berta_can_2_dev_scare_light
                  name: Scare Light
                  icon: mdi:lightbulb-alert-outline
                - type: custom:button-card
                  template: berta_control
                  entity: switch.berta_can_2_dev_water_pump
                  name: Water Pump
                  icon: mdi:water-pump
                - type: custom:button-card
                  template: berta_control
                  entity: switch.berta_can_2_dev_tank_heater
                  name: Tank Heater
                  icon: mdi:heating-coil
          center:
            do_not_eval: true
            card:
              type: vertical-stack
              cards:
                - type: custom:button-card
                  show_name: false
                  show_icon: false
                  tap_action:
                    action: none
                  custom_fields:
                    title: |
                      [[[
                        return `
                          <div class="berta-title-wrap">
                            <div class="berta-title-line">
                              <span class="berta-metal">BERTA</span>
                              <span class="berta-orange">CONTROL</span>
                            </div>
                            <div class="berta-subtitle">RV SYSTEMS DASHBOARD</div>
                          </div>
                        `;
                      ]]]
                  styles:
                    card:
                      - height: |
                          [[[
                            const w = window.innerWidth;
                            return (w >= 900 && w <= 1400) ? '82px' : '112px';
                          ]]]
                      - border-radius: 18px
                      - padding: 6px 8px
                      - background: transparent
                      - border: 0
                      - box-shadow: none
                    grid:
                      - grid-template-areas: '"title"'
                      - grid-template-columns: 1fr
                      - grid-template-rows: 1fr
                    custom_fields:
                      title:
                        - align-self: center
                        - justify-self: stretch
                  extra_styles: |
                    .berta-title-wrap {
                      text-align: center;
                      line-height: 1;
                    }
                    .berta-title-line {
                      display: flex;
                      justify-content: center;
                      align-items: baseline;
                      gap: 18px;
                      white-space: nowrap;
                    }
                    .berta-metal {
                      font-size: 58px;
                      font-weight: 950;
                      letter-spacing: .055em;
                      background: linear-gradient(180deg,#ffffff 0%,#dce1e4 44%,#909aa1 100%);
                      -webkit-background-clip: text;
                      color: transparent;
                      text-shadow: 0 2px 12px rgba(255,255,255,.05);
                    }
                    .berta-orange {
                      font-size: 58px;
                      font-weight: 850;
                      letter-spacing: .045em;
                      color: #ff9638;
                      text-shadow: 0 0 16px rgba(255,150,56,.18);
                    }
                    .berta-subtitle {
                      margin-top: 10px;
                      font-size: 13px;
                      letter-spacing: .42em;
                      color: #b7c0c6;
                    }
                    @media (min-width: 900px) and (max-width: 1400px) {
                      .berta-metal,
                      .berta-orange {
                        font-size: 42px;
                      }
                      .berta-title-line {
                        gap: 10px;
                      }
                      .berta-subtitle {
                        margin-top: 7px;
                        font-size: 10px;
                        letter-spacing: .34em;
                      }
                    }
                - type: horizontal-stack
                  cards:
                    - type: custom:button-card
                      entity: weather.forecast_home
                      name: Weather
                      icon: |
                        [[[
                          const s = entity?.state || '';
                          const icons = {
                            'clear-night': 'mdi:weather-night',
                            'cloudy': 'mdi:weather-cloudy',
                            'exceptional': 'mdi:weather-hurricane',
                            'fog': 'mdi:weather-fog',
                            'hail': 'mdi:weather-hail',
                            'lightning': 'mdi:weather-lightning',
                            'lightning-rainy': 'mdi:weather-lightning-rainy',
                            'partlycloudy': 'mdi:weather-partly-cloudy',
                            'pouring': 'mdi:weather-pouring',
                            'rainy': 'mdi:weather-rainy',
                            'snowy': 'mdi:weather-snowy',
                            'snowy-rainy': 'mdi:weather-snowy-rainy',
                            'sunny': 'mdi:weather-sunny',
                            'windy': 'mdi:weather-windy',
                            'windy-variant': 'mdi:weather-windy-variant'
                          };
                          return icons[s] || 'mdi:weather-partly-cloudy';
                        ]]]
                      show_state: true
                      state_display: |
                        [[[
                          const t = entity?.attributes?.temperature;
                          const unit = entity?.attributes?.temperature_unit || '°F';
                          const raw = entity?.state || 'unknown';
                          const condition = raw
                            .replaceAll('-', ' ')
                            .replace(/\b\w/g, c => c.toUpperCase());
                          if (Number.isFinite(Number(t))) {
                            return `${Math.round(Number(t))}${unit} • ${condition}`;
                          }
                          return condition;
                        ]]]
                      tap_action:
                        action: more-info
                      styles:
                        card:
                          - height: 54px
                          - border-radius: 14px
                          - background: rgba(8,19,27,.94)
                          - border: 1px solid rgba(56,201,255,.86)
                          - box-shadow: 0 0 16px rgba(56,201,255,.24)
                        icon:
                          - color: '#38c9ff'
                          - width: 20px
                        name:
                          - color: '#9fb0ba'
                          - font-size: 11px
                        state:
                          - color: '#f5f7f9'
                          - font-size: 12px
                          - font-weight: 750
                    - type: custom:button-card
                      entity: sensor.berta_weather_alert_summary
                      name: Weather Alerts
                      icon: mdi:weather-lightning
                      show_state: true
                      state_display: |
                        [[[
                          const s = entity?.state || 'UNKNOWN';
                          return s;
                        ]]]
                      tap_action:
                        action: navigate
                        navigation_path: /berta-control/weather-alerts
                      styles:
                        card:
                          - height: 54px
                          - border-radius: 14px
                          - background: rgba(8,19,27,.94)
                          - border: |
                              [[[
                                const state = (entity?.state || '').toUpperCase();
                                const severity = (entity?.attributes?.severity || '').toUpperCase();
                                if (state === 'CLEAR' || state === '0') return '1px solid rgba(75,220,120,.90)';
                                if (state.includes('EMERGENCY') || severity === 'EXTREME') return '1px solid rgba(255,60,60,.98)';
                                if (state.includes('WARNING') || severity === 'SEVERE') return '1px solid rgba(184,92,255,.98)';
                                if (state.includes('WATCH')) return '1px solid rgba(255,218,70,.98)';
                                if (state.includes('ADVISORY') || severity === 'MODERATE') return '1px solid rgba(255,153,46,.98)';
                                return '1px solid rgba(255,205,70,.92)';
                              ]]]
                          - box-shadow: |
                              [[[
                                const state = (entity?.state || '').toUpperCase();
                                const severity = (entity?.attributes?.severity || '').toUpperCase();
                                if (state === 'CLEAR' || state === '0') return '0 0 16px rgba(75,220,120,.30)';
                                if (state.includes('EMERGENCY') || severity === 'EXTREME') return '0 0 22px rgba(255,60,60,.52)';
                                if (state.includes('WARNING') || severity === 'SEVERE') return '0 0 22px rgba(184,92,255,.50)';
                                if (state.includes('WATCH')) return '0 0 18px rgba(255,218,70,.40)';
                                if (state.includes('ADVISORY') || severity === 'MODERATE') return '0 0 18px rgba(255,153,46,.42)';
                                return '0 0 16px rgba(255,205,70,.34)';
                              ]]]
                        icon:
                          - color: |
                              [[[
                                const state = (entity?.state || '').toUpperCase();
                                const severity = (entity?.attributes?.severity || '').toUpperCase();
                                if (state === 'CLEAR' || state === '0') return '#4bdc78';
                                if (state.includes('EMERGENCY') || severity === 'EXTREME') return '#ff3c3c';
                                if (state.includes('WARNING') || severity === 'SEVERE') return '#b85cff';
                                if (state.includes('WATCH')) return '#ffda46';
                                if (state.includes('ADVISORY') || severity === 'MODERATE') return '#ff992e';
                                return '#ffd24a';
                              ]]]
                          - width: 20px
                        name:
                          - color: '#9fb0ba'
                          - font-size: 11px
                        state:
                          - color: '#f5f7f9'
                          - font-size: 12px
                          - font-weight: 800
                    - type: custom:button-card
                      entity: sensor.berta_burn_ban
                      name: Burn Ban
                      icon: mdi:fire-alert
                      show_state: true
                      state_display: |
                        [[[
                          const s = entity?.state || 'UNKNOWN';
                          const county = entity?.attributes?.county;
                          return county ? `${s} • ${county}` : s;
                        ]]]
                      tap_action:
                        action: navigate
                        navigation_path: /berta-control/burn-ban
                      styles:
                        card:
                          - height: 54px
                          - border-radius: 14px
                          - background: rgba(8,19,27,.94)
                          - border: |
                              [[[
                                const s = (entity?.state || '').toUpperCase();
                                if (s.includes('ACTIVE')) return '1px solid rgba(255,70,55,.98)';
                                if (s.includes('NO BURN BAN')) return '1px solid rgba(75,220,120,.90)';
                                if (s.includes('OUT OF STATE')) return '1px solid rgba(85,180,255,.90)';
                                return '1px solid rgba(255,205,70,.95)';
                              ]]]
                          - box-shadow: |
                              [[[
                                const s = (entity?.state || '').toUpperCase();
                                if (s.includes('ACTIVE')) return '0 0 22px rgba(255,70,55,.50)';
                                if (s.includes('NO BURN BAN')) return '0 0 16px rgba(75,220,120,.30)';
                                if (s.includes('OUT OF STATE')) return '0 0 16px rgba(85,180,255,.28)';
                                return '0 0 16px rgba(255,205,70,.34)';
                              ]]]
                        icon:
                          - color: |
                              [[[
                                const s = (entity?.state || '').toUpperCase();
                                if (s.includes('ACTIVE')) return '#ff4637';
                                if (s.includes('NO BURN BAN')) return '#4bdc78';
                                if (s.includes('OUT OF STATE')) return '#55b4ff';
                                return '#ffd24a';
                              ]]]
                          - width: 20px
                        name:
                          - color: '#9fb0ba'
                          - font-size: 11px
                        state:
                          - color: '#f5f7f9'
                          - font-size: 11px
                          - font-weight: 800
                - type: markdown
                  content: |
                    ## 💧 WATER SAFETY
                    Leak sensors should read **DRY**. Valve card shows its Zigbee switch state; flow and device status are shown below.
                  card_mod:
                    style: |
                      ha-card {
                        padding: 9px 14px 7px;
                        border-radius: 16px 16px 10px 10px;
                        border: 1px solid rgba(56,201,255,.42);
                        background: rgba(8,19,27,.96);
                        color: #f5f7f9;
                        box-shadow: none;
                      }
                      ha-markdown h2 {
                        margin: 0;
                        color: #f5f7f9;
                        letter-spacing: .035em;
                      }
                      ha-markdown p {
                        margin: 5px 0 0;
                        color: #9fb0ba;
                        font-size: 12px;
                      }
                - type: horizontal-stack
                  cards:
                    - type: custom:button-card
                      entity: binary_sensor.bathroom_leak_sensor_water_leak
                      name: Bathroom
                      icon: mdi:water-alert
                      show_state: true
                      state_display: |
                        [[[
                          if (entity.state === 'on') return 'WET — LEAK';
                          if (entity.state === 'off') return 'DRY';
                          return (entity.state === 'unknown' ? 'NO STATE YET' : (entity.state || 'UNAVAILABLE')).toUpperCase();
                        ]]]
                      tap_action:
                        action: more-info
                      styles:
                        card:
                          - height: 76px
                          - border-radius: 14px
                          - background: rgba(8,19,27,.96)
                          - border: |
                              [[[ return entity.state === 'on' ? '2px solid #ff4637' : entity.state === 'off' ? '1px solid rgba(75,220,120,.72)' : '1px solid rgba(255,205,70,.85)'; ]]]
                          - box-shadow: |
                              [[[ return entity.state === 'on' ? '0 0 20px rgba(255,70,55,.44)' : 'none'; ]]]
                        icon:
                          - color: |
                              [[[ return entity.state === 'on' ? '#ff4637' : entity.state === 'off' ? '#4bdc78' : '#ffd24a'; ]]]
                          - width: 24px
                        name:
                          - color: '#f5f7f9'
                          - font-size: 11px
                        state:
                          - color: |
                              [[[ return entity.state === 'on' ? '#ff7168' : entity.state === 'off' ? '#58d68d' : '#ffd24a'; ]]]
                          - font-size: 11px
                          - font-weight: 900
                    - type: custom:button-card
                      entity: binary_sensor.0x00158d008bbac50f_water_leak
                      name: Kitchen
                      icon: mdi:water-alert
                      show_state: true
                      state_display: |
                        [[[ if (entity.state === 'on') return 'WET — LEAK'; if (entity.state === 'off') return 'DRY'; return (entity.state === 'unknown' ? 'NO STATE YET' : (entity.state || 'UNAVAILABLE')).toUpperCase(); ]]]
                      tap_action:
                        action: more-info
                      styles:
                        card:
                          - height: 76px
                          - border-radius: 14px
                          - background: rgba(8,19,27,.96)
                          - border: |
