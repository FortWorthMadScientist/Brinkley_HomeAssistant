  - title: Weather Alerts
    path: weather-alerts
    subview: true
    icon: mdi:weather-lightning
    cards:
      - type: markdown
        content: >
          # ⚡ WEATHER ALERTS


          {% set e =
          'sensor.nws_alerts_tracker_berta_location_nws_alerts_alerts' %}

          {% set count = states(e) | int(0) %}

          {% set alerts = state_attr(e, 'Alerts') %}


          {% if count == 0 or alerts is not iterable or alerts is string or
          alerts | count == 0 %}

          ## ✅ No Active NWS Alerts


          No active National Weather Service alerts are currently reported for
          Berta's location.

          {% else %}

          {% for alert in alerts %}

          ## {{ alert['Event'] }}


          **Headline:** {{ alert['Headline'] }}


          **Severity:** {{ alert['Severity'] }}  

          **Certainty:** {{ alert['Certainty'] }}  

          **Status:** {{ alert['Status'] }}


          **Effective:** {{ alert['Onset'] }}  

          **Ends:** {{ alert['Ends'] if alert['Ends'] is defined and
          alert['Ends'] else alert['Expires'] }}


          **Areas Affected:**  

          {{ alert['AreasAffected'] }}


          ### What NWS Says

          {{ alert['Description'] }}


          {% if alert['Instruction'] is defined and alert['Instruction'] %}

          ### Instructions

          {{ alert['Instruction'] }}

          {% endif %}


          ---

          {% endfor %}

          {% endif %}
        card_mod:
          style: |
            ha-card {
              border-radius: 18px;
              border: 1px solid rgba(255,153,46,.60);
              background: rgba(8,19,27,.97);
              color: #f5f7f9;
              box-shadow: 0 0 20px rgba(255,153,46,.18);
              padding: 8px 12px;
            }
            ha-markdown h1 {
              color: #ff992e;
              letter-spacing: .05em;
            }
            ha-markdown h2 {
              color: #f5f7f9;
            }
            ha-markdown h3 {
              color: #38c9ff;
            }
            ha-markdown p {
              line-height: 1.45;
            }
      - type: custom:button-card
        name: Back to Berta
        icon: mdi:arrow-left
        tap_action:
          action: navigate
          navigation_path: /berta-control/overview
        styles:
          card:
            - height: 54px
            - border-radius: 14px
            - background: rgba(8,19,27,.94)
            - border: 1px solid rgba(56,201,255,.55)
          icon:
            - color: '#38c9ff'
          name:
            - color: '#f5f7f9'
            - font-weight: 800
  - title: Burn Ban
    path: burn-ban
    subview: true
    icon: mdi:fire-alert
    cards:
      - type: markdown
        content: >
          # 🔥 BURN BAN STATUS


          {% set e = 'sensor.berta_burn_ban' %}

          {% set status = states(e) %}

          {% set county = state_attr(e, 'county') %}

          {% set source = state_attr(e, 'source') %}

          {% set source_status = state_attr(e, 'source_status') %}

          {% set source_url = state_attr(e, 'source_url') %}


          {% if 'ACTIVE' in status %}

          ## 🚫 {{ status }}

          {% elif 'NO BURN BAN' in status %}

          ## ✅ {{ status }}

          {% else %}

          ## ⚠️ {{ status }}

          {% endif %}


          **Current County:** {{ county if county else 'Unknown' }}


          **Source:** {{ source if source else 'Texas A&M Forest Service' }}


          **Feed Status:** {{ source_status if source_status else 'Available' }}


          This status follows Berta's live GPS location. When Berta moves to a
          different Texas county, the county is re-resolved and the burn-ban
          status is checked again.


          {% if source_url %}

          [Open the burn-ban source]({{ source_url }})

          {% endif %}


          ### Important

          Burn bans and outdoor-fire restrictions can vary by jurisdiction and
          may contain exceptions or additional local rules. Use this as a quick
          status indicator and open the source above when you need the full
          current restriction details.
        card_mod:
          style: |
            ha-card {
              border-radius: 18px;
              border: 1px solid
                {% if 'ACTIVE' in states('sensor.berta_burn_ban') %}
                  rgba(255,70,55,.80)
                {% else %}
                  rgba(75,220,120,.65)
                {% endif %};
              background: rgba(8,19,27,.97);
              color: #f5f7f9;
              box-shadow:
                {% if 'ACTIVE' in states('sensor.berta_burn_ban') %}
                  0 0 22px rgba(255,70,55,.22)
                {% else %}
                  0 0 18px rgba(75,220,120,.16)
                {% endif %};
              padding: 8px 12px;
            }
            ha-markdown h1 {
              color: #ff9638;
              letter-spacing: .05em;
            }
            ha-markdown h3 {
              color: #38c9ff;
            }
            ha-markdown p {
              line-height: 1.45;
            }
      - type: custom:button-card
        name: Back to Berta
        icon: mdi:arrow-left
        tap_action:
          action: navigate
          navigation_path: /berta-control/overview
        styles:
          card:
            - height: 54px
            - border-radius: 14px
            - background: rgba(8,19,27,.94)
            - border: 1px solid rgba(56,201,255,.55)
          icon:
            - color: '#38c9ff'
          name:
            - color: '#f5f7f9'
            - font-weight: 800
  - title: ICE
    path: ice
